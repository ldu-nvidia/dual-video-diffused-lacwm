defaults:
  - dual_explicit_action_dit_vjepa
  - _self_

_target_: lam.two_clock_consistency_model.TwoClockConsistencyVPM

# Arm files change only the weight. Both arms run the same two Wan calls,
# RF losses, clean predictions, and diagnostics.
two_clock_consistency:
  weight: 0.0
  epsilon: 1.0e-6
  high_sigma_min: 0.8
  high_sigma_max: 1.0
  low_sigma_min: 0.0
  low_sigma_max: 0.4
