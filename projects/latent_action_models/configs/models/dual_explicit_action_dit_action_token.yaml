defaults:
  - dual_explicit_action_dit_vjepa
  - _self_

_target_: lam.action_token_conditioned_model.ActionTokenConditionedVPM

# Arm files change only `enabled`. Both instantiate and execute the exact same
# per-substep adapter with the same frozen 0.1 scalar; AT-OFF hard-masks it.
action_token:
  enabled: false
  stats_path: ${oc.env:ACTION_TOKEN_STATS}
  expected_stats_sha256: ${oc.env:ACTION_TOKEN_STATS_SHA256}
  action_dim: 157
  chunk_size: 5
  num_transitions: 8
  morph_dim: 64
  hidden: 256
  text_dim: 4096
  clip_value: 8.0
  initialization_seed: 20260808
  gate_init: 0.1
  gate_trainable: false
