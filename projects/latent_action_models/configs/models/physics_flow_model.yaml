defaults:
  - dual_explicit_action_dit_vjepa
  - _self_

_target_: lam.physics_flow_model.PhysicsFlowVPM
time_frequency_transform: null
physics_flow:
  fuse_flow: false
  condition_family: raw_geometry_scaffold
dual_diffusion:
  enabled: true
  auxiliary_history_mode: diffuse_all
  tf_channels: 16
  preserve_zero_support: true
  head_condition_on_tf_clock: false
  condition_on_tf_clock: false
  condition_on_tf: false
  condition_mode: "off"
  schedule_mode: aligned
  tf_lead_logit: 0.0
  tf_loss_weight: 0.0
  video_only_control: false
  parameter_matched_control: false
  state_gate_init: 0.02
  state_gate_trainable: true
  clock_gate_init: 0.0
  clock_gate_trainable: true
  capture_latent_trajectories: false
  artifact_batch_limit: null
  evaluation_nfe_steps: [1, 2, 4]
  # The untouched de65 parent was trained/evaluated with this stateless base
  # seed.  All Stage-1 arms must share it so same-sample endpoint noise is
  # identical before any model is instantiated.
  evaluation_noise_seed: 20260729
  evaluation_condition_sources: [autonomous]
