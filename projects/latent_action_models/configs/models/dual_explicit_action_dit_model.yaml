defaults:
  - _self_
  - /tokenizers/rgb@rgb_tokenizer: ???
  - /networks@forward_model: wan_forward

_target_: lam.dual_explicit_action_dit_model.DualExplicitActionDiTModel
latent_action_dim: 64
num_history_frames: 5
num_future_frames: 8
viz_num_steps: 8
rgb_tokenizer: ${rgb_tokenizer}
time_frequency_transform:
  _target_: robot_wm.modeling.dual_diffusion.time_frequency.PerViewCausalRFFT
  num_views: 3
  output_size: [24, 120]
  window_size: 4
  pad_multiple: 16
  pad_value: -1.0
  # Explicit research ablation coordinate. ``raw_rfft`` is the historical
  # implementation; alternatives retain the identical tensor shape.
  representation: raw_rfft
  # Per-sample normalization would make the observed history scale depend on
  # hidden future frames. Use causal raw coefficients for this pilot; fixed
  # train-split whitening statistics are a later representation ablation.
  normalization: none
dual_diffusion:
  enabled: true
  condition_on_tf: false
  # ``condition_mode`` is the causal experimental intervention. ``off`` keeps
  # the video trunk blind to TF, ``matched`` injects this sample's current TF
  # state, and ``shuffled`` injects another sample's hidden-future TF while
  # retaining the correct observed history and local corruption noise.
  # Quote ``off`` because YAML 1.1 otherwise resolves it to Boolean false.
  condition_mode: "off"
  tf_channels: 12
  # Effective post-LayerNorm scale (the adapter stores atanh(scale) so the
  # configured value is directly interpretable). The production-safe default
  # remains an exact zero residual with a trainable gate.
  state_gate_init: 0.0
  state_gate_trainable: true
  schedule_mode: tf_leads
  tf_lead_logit: 1.0
  # Used only when schedule_mode=tf_first_cascaded. Strict cascade inference
  # needs NFE>=2 and counts TF-only plus video-only calls in the NFE budget.
  cascade_tf_loss_probability: 0.4
  cascade_logit_mean: 0.0
  cascade_logit_std: 1.0
  cascade_tf_condition_max_sigma: 0.25
  cascade_validation_tf_sigma: 0.125
  cascade_inference_tf_fraction: 0.5
  # When enabled, matched/shuffled state content is injected only into
  # video-loss examples. TF-loss examples retain their own noisy TF state and
  # clock, but receive a zero TF-content residual in the shared Wan trunk.
  # This prevents the experimental condition from directly changing auxiliary
  # TF-denoiser training.
  cascade_condition_only_video_loss_examples: false
  # Evaluation-only strict-cascade diagnostic. When true, autonomous sampling
  # keeps TF-content injection off throughout the TF-only phase and turns it on
  # only after TF reaches sigma=0 and freezes for the video phase. The default
  # false preserves historical all-call inference exactly.
  cascade_stage_faithful_inference: false
  # Evaluation-only privileged-training diagnostic. This independently masks
  # the TF sigma-clock residual during sampling; it never changes training.
  # False preserves all existing sampler behavior.
  evaluation_disable_tf_clock: false
  tf_loss_weight: 1.0
  clock_embedding_dim: 128
  capture_latent_trajectories: true
  evaluation_nfe_steps: [8]
  evaluation_noise_seed: 20260726
  # Oracle sources are leakage-only diagnostics and remain disabled by default.
  # Under stage-faithful strict inference, ``autonomous_shuffled`` rolls only
  # generated future TF content once at the phase boundary, while
  # ``autonomous_legacy`` retains historical all-call injection.
  evaluation_condition_sources: [autonomous]
  validation_video_sigmas: [0.90, 0.75, 0.50, 0.25]
forward_model:
  latent_action_dim: ${..latent_action_dim}
  dual_diffusion: ${..dual_diffusion}
action_encoder:
  _target_: robot_wm.modeling.networks.action_encoder.ActionEncoderMLP
  action_dim: 157
  chunk_size: 5
  latent_dim: ${..latent_action_dim}
  morph_dim: ${..latent_action_dim}
  hidden: 512
  num_layers: 3
config:
  flow_loss_on_future_only: true
