defaults:
  - _self_
  - /tokenizers/rgb@rgb_tokenizer: ???
  - /networks@forward_model: wan_forward

_target_: lam.dual_explicit_action_dit_model.DualExplicitActionDiTModel
latent_action_dim: 64
num_history_frames: 5
num_future_frames: 8
viz_num_steps: 8
rgb_tokenizer: ${rgb_tokenizer}
time_frequency_transform:
  _target_: robot_wm.modeling.dual_diffusion.time_frequency.PerViewCausalRFFT
  num_views: 3
  output_size: [24, 120]
  window_size: 4
  pad_multiple: 16
  pad_value: -1.0
  # Explicit research ablation coordinate. ``raw_rfft`` is the historical
  # implementation; alternatives retain the identical tensor shape.
  representation: raw_rfft
  # Per-sample normalization would make the observed history scale depend on
  # hidden future frames. Use causal raw coefficients for this pilot; fixed
  # train-split whitening statistics are a later representation ablation.
  normalization: none
dual_diffusion:
  enabled: true
  condition_on_tf: false
  # Legacy RFFT targets are causal in their observed prefix. Bidirectional
  # learned targets such as V-JEPA override this with ``diffuse_all`` so no
  # clean full-clip feature is leaked into autonomous inference.
  auxiliary_history_mode: clamp_clean
  # ``condition_mode`` is the causal experimental intervention. ``off`` keeps
  # the video trunk blind to TF, ``matched`` injects this sample's current TF
  # state, and ``shuffled`` injects another sample's hidden-future TF while
  # retaining the correct observed history and local corruption noise.
  # Quote ``off`` because YAML 1.1 otherwise resolves it to Boolean false.
  condition_mode: "off"
  tf_channels: 12
  # Effective post-LayerNorm scale (the adapter stores atanh(scale) so the
  # configured value is directly interpretable). The production-safe default
  # remains an exact zero residual with a trainable gate.
  state_gate_init: 0.0
  state_gate_trainable: true
  # The TF clock residual has an independent checkpoint-compatible gate.
  # Both gates are frozen at exact zero only in the true video-only control.
  clock_gate_init: 0.0
  clock_gate_trainable: true
  # The shared video trunk and auxiliary velocity head have separate clock
  # switches. This permits an auxiliary-supervision-only control whose head
  # knows its noise level while the video generator cannot consume it.
  # True preserves the historical RFFT dual-model behavior. JEPA study
  # controls override this explicitly per arm.
  condition_on_tf_clock: true
  head_condition_on_tf_clock: false
  schedule_mode: tf_leads
  tf_lead_logit: 1.0
  tf_loss_weight: 1.0
  video_only_control: false
  # Scientific no-op with the same trainable parameter schema as dual arms.
  # It preserves the original video RNG/objective while retaining unused
  # trainable auxiliary parameters for a parameter-matched comparison.
  parameter_matched_control: false
  clock_embedding_dim: 128
  capture_latent_trajectories: true
  # Trainer visualization keeps one evidence sample per rank. Dedicated paired
  # evaluation overrides this to null and persists every item in its batch.
  artifact_batch_limit: 1
  evaluation_nfe_steps: [8]
  evaluation_noise_seed: 20260726
  # Oracle sources are leakage-only diagnostics and remain disabled by
  # default. ``autonomous_shuffled`` is also opt-in: it is the deployable
  # same-checkpoint evaluation control that rolls only generated future TF
  # residuals while retaining local history and corruption noise.
  evaluation_condition_sources: [autonomous]
  validation_video_sigmas: [0.90, 0.75, 0.50, 0.25]
forward_model:
  latent_action_dim: ${..latent_action_dim}
  dual_diffusion: ${..dual_diffusion}
action_encoder:
  _target_: robot_wm.modeling.networks.action_encoder.ActionEncoderMLP
  action_dim: 157
  chunk_size: 5
  latent_dim: ${..latent_action_dim}
  morph_dim: ${..latent_action_dim}
  hidden: 512
  num_layers: 3
config:
  flow_loss_on_future_only: true
