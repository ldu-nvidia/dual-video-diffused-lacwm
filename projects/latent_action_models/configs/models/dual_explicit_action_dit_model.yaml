defaults:
  - _self_
  - /tokenizers/rgb@rgb_tokenizer: ???
  - /networks@forward_model: wan_forward

_target_: lam.dual_explicit_action_dit_model.DualExplicitActionDiTModel
latent_action_dim: 64
num_history_frames: 5
num_future_frames: 8
viz_num_steps: 8
rgb_tokenizer: ${rgb_tokenizer}
time_frequency_transform:
  _target_: robot_wm.modeling.dual_diffusion.time_frequency.PerViewCausalRFFT
  num_views: 3
  output_size: [24, 120]
  window_size: 4
  pad_multiple: 16
  pad_value: -1.0
  # Per-sample normalization would make the observed history scale depend on
  # hidden future frames. Use causal raw coefficients for this pilot; fixed
  # train-split whitening statistics are a later representation ablation.
  normalization: none
dual_diffusion:
  enabled: true
  condition_on_tf: false
  # ``condition_mode`` is the causal experimental intervention. ``off`` keeps
  # the video trunk blind to TF, ``matched`` injects this sample's current TF
  # state, and ``shuffled`` injects another sample's hidden-future TF while
  # retaining the correct observed history and local corruption noise.
  condition_mode: off
  tf_channels: 12
  # Effective post-LayerNorm scale (the adapter stores atanh(scale) so the
  # configured value is directly interpretable). The production-safe default
  # remains an exact zero residual with a trainable gate.
  state_gate_init: 0.0
  state_gate_trainable: true
  schedule_mode: tf_leads
  tf_lead_logit: 1.0
  tf_loss_weight: 1.0
  clock_embedding_dim: 128
  capture_latent_trajectories: true
  evaluation_nfe_steps: [8]
  evaluation_noise_seed: 20260726
  # Oracle sources are leakage-only diagnostics and remain disabled by
  # default. Causal-screen configs may enable them to test whether aligned TF
  # content is usable independently of autonomous TF-denoiser quality.
  evaluation_condition_sources: [autonomous]
  validation_video_sigmas: [0.90, 0.75, 0.50, 0.25]
forward_model:
  latent_action_dim: ${..latent_action_dim}
  dual_diffusion: ${..dual_diffusion}
action_encoder:
  _target_: robot_wm.modeling.networks.action_encoder.ActionEncoderMLP
  action_dim: 157
  chunk_size: 5
  latent_dim: ${..latent_action_dim}
  morph_dim: ${..latent_action_dim}
  hidden: 512
  num_layers: 3
config:
  flow_loss_on_future_only: true
