defaults:
  - dual_explicit_action_dit_model
  - _self_

# Clean V-JEPA features are read from the immutable offline cache. The teacher
# is deliberately absent from model construction, checkpoints, and inference.
time_frequency_transform: null
dual_diffusion:
  # The V-JEPA schema may be composed for inspection without silently enabling
  # dual diffusion. Controlled-study and phase-gate entrypoints opt in.
  enabled: false
  auxiliary_history_mode: diffuse_all
  tf_channels: 64
  head_condition_on_tf_clock: true
  condition_on_tf_clock: false
  condition_on_tf: false
  condition_mode: "off"
  schedule_mode: aligned
  tf_lead_logit: 0.0
  tf_loss_weight: 1.0
  # Strict Latent-Forcing-style cascade defaults. They are inert unless
  # schedule_mode=tf_first_cascaded.
  cascade_tf_loss_probability: 0.4
  # The released recipe samples DINO clean-time with mean -1.2. In LACWM's
  # opposite sigma convention this is auxiliary-noise logit mean +1.2.
  cascade_logit_mean: 1.2
  cascade_logit_std: 1.0
  cascade_tf_condition_max_sigma: 0.25
  cascade_validation_tf_sigma: 0.125
  cascade_inference_tf_fraction: 0.5
  video_only_control: false
  parameter_matched_control: false
  state_gate_init: 0.0
  state_gate_trainable: true
  clock_gate_init: 0.0
  clock_gate_trainable: true
  evaluation_nfe_steps: [4]
  evaluation_condition_sources:
    - autonomous
    - "off"
    - autonomous_shuffled
