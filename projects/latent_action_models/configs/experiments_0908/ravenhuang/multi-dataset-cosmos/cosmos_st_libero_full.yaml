# @package _global_
# Full libero training on .24.3 (8x B200). From scratch. Full CSVs + ckpts on /scr.
# Run with: torchrun --standalone --nproc_per_node=8 train.py +experiments_0908=ravenhuang/multi-dataset-cosmos/cosmos_st_libero_full.yaml
defaults:
  - ravenhuang/multi-dataset-cosmos/libero_sim_split_base.yaml

name: libero_full

dataset:
  transform:
    sample_size: 9
  datasets:
    Libero:
      manifest: "/home/ravenh/lacwm/lacwm/robot_wm/datasets/csv_files/libero.csv"
      sample_zero_action: true
      transform:
        resize_to: [180, 320]
        cameras: ["agentview_rgb"]

val_dataset:
  datasets:
    Libero:
      manifest: "/home/ravenh/lacwm/lacwm/robot_wm/datasets/csv_files/libero.csv"
      sample_zero_action: true
      transform:
        resize_to: [180, 320]
        cameras: ["agentview_rgb"]

viz_dataset:
  datasets:
    Libero:
      manifest: "/home/ravenh/lacwm/lacwm/robot_wm/datasets/csv_files/libero.csv"
      sample_zero_action: true
      transform:
        resize_to: [180, 320]
        cameras: ["agentview_rgb"]

libero_unseen_val_dataset:
  datasets:
    Libero:
      manifest: "/home/ravenh/lacwm/lacwm/robot_wm/datasets/csv_files/libero_val.csv"
      sample_zero_action: true
      transform:
        resize_to: [180, 320]
        cameras: ["agentview_rgb"]

data_loader:
  batch_size: 8
  num_workers: 8

model:
  rgb_tokenizer:
    tokenizer_name: Cosmos-0.1-Tokenizer-CI8x8
    output_dim: 16
  rgb_pos_embed:
    _args_:
      - ${dataset.transform.sample_size}
      - 23
      - 40
  inverse_model:
    arch: small
    num_actions: 1
  quantizer:
    dim: 64
    size: 2048
    use_ste: False
  morphology_tokens:
    _target_: robot_wm.modeling.modules.learnable_embeddings.LearnableEmbeddings
    num_embeddings: 9
    embedding_dim: 64
  forward_model:
    arch: small
    use_video_cross_attention: true
    use_spatial_attention_only: false
    rope_end: 2048
  loss_scheduler:
    pretrain_steps: 0
    ae_only_steps: 80_001
    losses: ["teacher-forcing"]
  config:
    backprog_action_decoding: False
    decode_zhat: True
    action_decoding_weight: 10
    action_decoding_loss_type: "l1"
    use_cycle_consistency_loss: False

wandb:
  entity: project_vit
  project: lacwm

trainer:
  config:
    max_iter: 80_000

hydra:
  run:
    dir: /scr/ravenh/lacwm_runs/${name}/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: /scr/ravenh/lacwm_runs/${name}/${now:%Y-%m-%d}/${now:%H-%M-%S}
