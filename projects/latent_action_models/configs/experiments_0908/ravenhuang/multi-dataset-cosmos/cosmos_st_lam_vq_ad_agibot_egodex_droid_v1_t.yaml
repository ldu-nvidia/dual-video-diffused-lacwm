# @package _global_
defaults:
  - ravenhuang/multi-dataset-cosmos/cosmos_st_lam_vq_ad_agibot_egodex_droid_split_xatten_base.yaml

## notes:
## model size: ~140M params
## effective batch size: 384 (6 nodes)

name: lam_agibot_egodex_droid_mt_xatten_cosmos_t

dataset:
  img_augment: True
  datasets:
    Agibot:
      subsample_traj: 50000
    EgoDex:
      subsample_traj: 50000
    Droid:
      subsample_traj: 50000

data_loader:
  batch_size: 8

hydra:
  launcher:
    nodes: 8
    account: robotics
    qos: h200_robotics_high
    timeout_min: 4300

model:
  inverse_model:
    arch: small
    num_actions: 1
  quantizer:
    dim: 64
    size: 2048
    use_ste: False
  forward_model:
    arch: small
    # use_video_cross_attention: false
    # use_spatial_attention_only: true
    use_video_cross_attention: true
    use_spatial_attention_only: false
  morphology_tokens:
    _target_: robot_wm.modeling.modules.learnable_embeddings.LearnableEmbeddings
    num_embeddings: 9
    embedding_dim: 64
  loss_scheduler:
    pretrain_steps: 0
    ae_only_steps: 80_001
    action_decode_steps: 80_000
    # action_only_steps: 20_000
    # forward_only_steps: 80_001
    losses: ["teacher-forcing"]
  config:
    backprog_action_decoding: True
    decode_zhat: True
    action_decoding_weight: 50
    action_decoding_loss_type: "l1"
    use_cycle_consistency_loss: False

wandb:
  entity: robot_world_models


trainer:
  config:
    max_iter: 20_000
    load_path: /storage/home/ravenhuang/h2r/robot_world_models/projects/latent_action_models/data/experiments/lam_agibot_egodex_droid_mt_xatten/2025-09-07/20-56-41/0/snapshot.pt
    exclude_keys:
    - loss_scheduler
