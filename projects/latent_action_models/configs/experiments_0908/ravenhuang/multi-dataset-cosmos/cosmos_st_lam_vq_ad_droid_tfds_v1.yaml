# @package _global_
defaults:
  - ravenhuang/multi-dataset-cosmos/cosmos_st_lam_vq_ad_droid_tfds_xatten_base.yaml

## notes:
## DROID-only training from tfrecords (no H5 conversion needed)
## model size: ~140M params

name: lam_droid_tfds_xatten_cosmos

dataset:
  img_augment: True
  datasets:
    Droid:
      subsample_traj: 50000

data_loader:
  batch_size: 2

hydra:
  launcher:
    nodes: 8
    account: viscam
    qos: normal
    timeout_min: 4300

model:
  rgb_tokenizer:
    tokenizer_name: "Cosmos-0.1-Tokenizer-CI8x8"
    output_dim: 16
  inverse_model:
    arch: small
    num_actions: 1
  quantizer:
    dim: 64
    size: 2048
    use_ste: False
  forward_model:
    arch: small
    use_video_cross_attention: false
    use_spatial_attention_only: true
  morphology_tokens:
    _target_: robot_wm.modeling.modules.learnable_embeddings.LearnableEmbeddings
    num_embeddings: 9
    embedding_dim: 64
  loss_scheduler:
    pretrain_steps: 0
    ae_only_steps: 80_001
    action_decode_steps: 80_000
    losses: ["teacher-forcing"]
  config:
    backprog_action_decoding: True
    decode_zhat: True
    action_decoding_weight: 50
    action_decoding_loss_type: "l1"
    use_cycle_consistency_loss: False

wandb:
  entity: project_vit
  project: lacwm


trainer:
  config:
    max_iter: 60_000