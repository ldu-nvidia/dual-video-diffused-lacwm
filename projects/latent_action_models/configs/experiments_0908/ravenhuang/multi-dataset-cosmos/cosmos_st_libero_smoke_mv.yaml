# @package _global_
# Multi-view smoke: libero agentview(ego)+wrist, multiview stack + wrist masking.
defaults:
  - ravenhuang/multi-dataset-cosmos/libero_sim_split_base.yaml

name: libero_smoke_mv

dataset:
  transform:
    sample_size: 9
  datasets:
    Libero:
      manifest: "/home/ravenh/lacwm/lacwm/robot_wm/datasets/csv_files/libero_smoke_train.csv"
      sample_zero_action: true
      transform:
        resize_to: [180, 320]
        cameras: ["agentview_rgb", "wrist_rgb"]
        multiview: true
        wrist_mask_prob: 0.5
val_dataset:
  datasets:
    Libero:
      manifest: "/home/ravenh/lacwm/lacwm/robot_wm/datasets/csv_files/libero_smoke_train.csv"
      sample_zero_action: true
      transform:
        resize_to: [180, 320]
        cameras: ["agentview_rgb", "wrist_rgb"]
        multiview: true
        wrist_mask_prob: 0.0
viz_dataset:
  datasets:
    Libero:
      manifest: "/home/ravenh/lacwm/lacwm/robot_wm/datasets/csv_files/libero_smoke_train.csv"
      sample_zero_action: true
      transform:
        resize_to: [180, 320]
        cameras: ["agentview_rgb", "wrist_rgb"]
        multiview: true
        wrist_mask_prob: 0.0
libero_unseen_val_dataset:
  datasets:
    Libero:
      manifest: "/home/ravenh/lacwm/lacwm/robot_wm/datasets/csv_files/libero_smoke_train.csv"
      sample_zero_action: true
      transform:
        resize_to: [180, 320]
        cameras: ["agentview_rgb", "wrist_rgb"]
        multiview: true
        wrist_mask_prob: 0.0

data_loader:
  batch_size: 4
  num_workers: 2

model:
  rgb_tokenizer:
    tokenizer_name: Cosmos-0.1-Tokenizer-CI8x8
    output_dim: 16
  rgb_pos_embed:
    _args_:
      - ${dataset.transform.sample_size}
      - 23
      - 80
  inverse_model:
    arch: small
    num_actions: 1
  quantizer:
    dim: 64
    size: 2048
    use_ste: False
  morphology_tokens:
    _target_: robot_wm.modeling.modules.learnable_embeddings.LearnableEmbeddings
    num_embeddings: 9
    embedding_dim: 64
  forward_model:
    arch: small
    use_video_cross_attention: true
    use_spatial_attention_only: false
    rope_end: 2048
  loss_scheduler:
    pretrain_steps: 0
    ae_only_steps: 85_001
    losses: ["teacher-forcing"]
  config:
    backprog_action_decoding: False
    decode_zhat: True
    action_decoding_weight: 10
    action_decoding_loss_type: "l1"
    use_cycle_consistency_loss: False

wandb:
  entity: project_vit
  project: lacwm

trainer:
  config:
    max_iter: 30
    logging:
      log_every: 5
    saving:
      save_every: 20
    validation:
      val_every: 25
      n_val_samples: 4
    visualization:
      viz_every: 1000

hydra:
  run:
    dir: /scr/ravenh/lacwm_runs/${name}/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: /scr/ravenh/lacwm_runs/${name}/${now:%Y-%m-%d}/${now:%H-%M-%S}
