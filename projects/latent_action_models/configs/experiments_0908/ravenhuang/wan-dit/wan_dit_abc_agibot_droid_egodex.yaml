# @package _global_
# Latent-action WORLD model with a Wan2.1-Fun-1.3B-Control diffusion forward model,
# on ABC + Agibot + DROID + EgoDex. RGB tokenizer = Wan VAE; forward model = Wan DiT
# (LoRA fine-tuned). Inverse model (latent action) + per-morph action decoder as usual.
# Clip = 5 history + 8 future = 13 frames
# (Wan causal VAE needs F = 4k+1). Latent action -> Fun-Control "control" channel.
# Launch (8 GPU):
#   torchrun --standalone --nproc_per_node=8 train.py +experiments_0908=ravenhuang/wan-dit/wan_dit_abc_agibot_droid_egodex.yaml
defaults:
  - override /datasets@dataset: transformed_multi_abc_agibot_droid_egodex
  - override /datasets@val_dataset: transformed_multi_abc_agibot_droid_egodex
  - override /datasets@viz_dataset: transformed_multi_abc_agibot_droid_egodex
  - override /models@model: latent_action_dit_model
  - override /tokenizers/rgb@model.rgb_tokenizer: wan_vae
  - override /optimizers@optimizer_factory: adamw
  - override /lr_schedulers@lr_scheduler_factory: linear_warmup_cosine_decay

name: wan_dit_abc_agibot_droid_egodex

dataset: &ds
  padding_dim: 157
  seed: ${seed}
  infinite: true
  img_augment: True   # augmented in [0,1] before re-normalizing to [-1,1] (see MultiDataset)
  emit_crop_rgb: false  # the Wan models do not consume this duplicate image tensor
  transform:
    sample_size: 13   # 5 history + 8 future
    chunk_size: 5
val_dataset:
  <<: *ds
  img_augment: False
viz_dataset:
  <<: *ds
  img_augment: False

val_data_loader:
  - _target_: torchdata.stateful_dataloader.StatefulDataLoader
    dataset: ${val_dataset}
    batch_size: ${data_loader.batch_size}
    num_workers: 2
    pin_memory: true
    prefetch_factor: 2
viz_data_loader:
  - _target_: torchdata.stateful_dataloader.StatefulDataLoader
    dataset: ${viz_dataset}
    batch_size: 2
    num_workers: 1
    pin_memory: true
    prefetch_factor: 1
    persistent_workers: False

data_loader:
  # 80 GiB profile: four physical samples per GPU, accumulated four times.
  # Across eight ranks this preserves the original effective global batch 128.
  batch_size: 4
  num_workers: 16
  pin_memory: true
  prefetch_factor: 4
  persistent_workers: true

model:
  rgb_tokenizer: {output_dim: 16, input_mean: [0.5, 0.5, 0.5], input_std: [0.5, 0.5, 0.5]}
  rgb_pos_embed:
    _args_: ["${dataset.transform.sample_size}", 24, 120]
  inverse_model: {arch: small, num_actions: 1, rope_end: 6144}
  action_pos_embed:
    _args_: ["${dataset.transform.sample_size}", "${model.inverse_model.num_actions}"]
  forward_model: {lora_rank: 64, lora_alpha: 128, lora_dropout: 0.05, gradient_checkpointing: true}
  num_history_frames: 5
  num_future_frames: 8
  morphology_tokens:
    _target_: robot_wm.modeling.modules.learnable_embeddings.LearnableEmbeddings
    num_embeddings: 10
    embedding_dim: 64
  action_decoder:
    _target_: robot_wm.modeling.modules.mlp.SplitMultiMLP
    input_dim: ${mul:${model.latent_action_dim},${model.inverse_model.num_actions}}
    split_type:
      action_type_split:
        "ee": [0, "${div:${model.action_decoder.input_dim},2}"]
        "joint_states": [0, "${div:${model.action_decoder.input_dim},2}"]
        "camera": ["${div:${model.action_decoder.input_dim},2}", "${model.action_decoder.input_dim}"]
      "0": {"ee": 50,  "camera": 45}
      "2": {"ee": 740, "camera": 45}
      "6": {"ee": 100, "joint_states": 70, "camera": 45}
      "9": {"ee": 70,  "camera": 45}
    decoders:
      "0": {target: robot_wm.modeling.tokenizers.action.decoder.ActionXattenDecoder, input_dim: "${model.action_decoder.input_dim}", hidden_dim: 1024, output_dim: 95,  rgb_latent_dim: "${model.rgb_tokenizer.output_dim}"}
      "2": {target: robot_wm.modeling.tokenizers.action.decoder.ActionXattenDecoder, input_dim: "${model.action_decoder.input_dim}", hidden_dim: 1024, output_dim: 785, rgb_latent_dim: "${model.rgb_tokenizer.output_dim}"}
      "6": {target: robot_wm.modeling.tokenizers.action.decoder.ActionXattenDecoder, input_dim: "${model.action_decoder.input_dim}", hidden_dim: 1024, output_dim: 215, rgb_latent_dim: "${model.rgb_tokenizer.output_dim}"}
      "9": {target: robot_wm.modeling.tokenizers.action.decoder.ActionXattenDecoder, input_dim: "${model.action_decoder.input_dim}", hidden_dim: 1024, output_dim: 115, rgb_latent_dim: "${model.rgb_tokenizer.output_dim}"}
  config:
    action_decoding_weight: 0.1
    action_decoding_loss_type: "l1"
    flow_loss_on_future_only: true

optimizer_factory: {lr: 1e-4, betas: [0.9, 0.95]}
lr_scheduler_factory:
  lr_lambda:
    warmup_steps: 2_000
    total_steps: ${trainer.config.max_iter}
    final_learning_rate: 1e-6

wandb: {project: lacwm}

trainer:
  config:
    max_iter: 60_000
    gradient_accumulation_steps: 4
    logging: {log_every: 50}
    saving: {save_every: 1000}
    validation: {val_every: 1000, n_val_samples: 25}
    visualization: {viz_every: 1000}
    gradient_clipping: {max_norm: 1.0}

hydra:
  run:
    dir: ${oc.env:LACWM_RUNS,/scr/ravenh/lacwm_runs}/${name}/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${oc.env:LACWM_RUNS,/scr/ravenh/lacwm_runs}/${name}/${now:%Y-%m-%d}/${now:%H-%M-%S}
