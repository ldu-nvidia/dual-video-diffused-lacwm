# @package _global_
# Smoke test for the EXPLICIT action world model (GT actions -> MLP -> control).
#   torchrun --standalone --nproc_per_node=1 train.py +experiments_0908=ravenhuang/wan-dit/wan_dit_explicit_smoke.yaml
defaults:
  - override /datasets@dataset: transformed_multi_abc_agibot_droid_egodex
  - override /datasets@val_dataset: transformed_multi_abc_agibot_droid_egodex
  - override /datasets@viz_dataset: transformed_multi_abc_agibot_droid_egodex
  - override /models@model: explicit_action_dit_model
  - override /tokenizers/rgb@model.rgb_tokenizer: wan_vae
  - override /optimizers@optimizer_factory: adamw
  - override /lr_schedulers@lr_scheduler_factory: linear_warmup_cosine_decay

name: wan_dit_explicit_smoke

dataset: &ds
  padding_dim: 157
  seed: ${seed}
  infinite: true
  img_augment: True
  transform:
    sample_size: 13
    chunk_size: 5
  datasets:
    Droid:  {subsample_traj: 40}
    EgoDex: {subsample_traj: 40}
    Agibot: {subsample_traj: 40}
    ABC:    {subsample_traj: 40}
val_dataset:
  <<: *ds
  img_augment: False
viz_dataset:
  <<: *ds
  img_augment: False

val_data_loader:
  - _target_: torchdata.stateful_dataloader.StatefulDataLoader
    dataset: ${val_dataset}
    batch_size: 1
    num_workers: 2
    pin_memory: true
    prefetch_factor: 2
viz_data_loader:
  - _target_: torchdata.stateful_dataloader.StatefulDataLoader
    dataset: ${viz_dataset}
    batch_size: 2
    num_workers: 1
    pin_memory: true
    prefetch_factor: 1
    persistent_workers: False

data_loader:
  batch_size: 1
  num_workers: 2
  pin_memory: true
  prefetch_factor: 2
  persistent_workers: false

model:
  rgb_tokenizer: {output_dim: 16, input_mean: [0.5, 0.5, 0.5], input_std: [0.5, 0.5, 0.5]}
  forward_model: {lora_rank: 8, lora_alpha: 16, lora_dropout: 0.05, gradient_checkpointing: true}
  num_history_frames: 5
  num_future_frames: 8
  action_encoder:
    action_dim: ${dataset.padding_dim}
    chunk_size: ${dataset.transform.chunk_size}
  morphology_tokens:
    _target_: robot_wm.modeling.modules.learnable_embeddings.LearnableEmbeddings
    num_embeddings: 10
    embedding_dim: 64
  loss_scheduler:
    pretrain_steps: 0
    warmup_steps: 100
    total_steps: ${trainer.config.max_iter}
    losses: ["teacher-forcing"]
    seed: ${seed}
  config:
    flow_loss_on_future_only: true

optimizer_factory: {lr: 1e-4, betas: [0.9, 0.95]}
lr_scheduler_factory:
  lr_lambda:
    warmup_steps: 5
    total_steps: ${trainer.config.max_iter}
    final_learning_rate: 1e-6

wandb: {project: lacwm, mode: disabled}

trainer:
  config:
    max_iter: 12
    logging: {log_every: 1}
    saving: {save_every: 10_000}
    validation: {val_every: 6, n_val_samples: 2}
    visualization: {viz_every: 6}
    gradient_clipping: {max_norm: 1.0}

hydra:
  run:
    dir: ${oc.env:LACWM_RUNS,/scr/ravenh/lacwm_runs}/${name}/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${oc.env:LACWM_RUNS,/scr/ravenh/lacwm_runs}/${name}/${now:%Y-%m-%d}/${now:%H-%M-%S}
