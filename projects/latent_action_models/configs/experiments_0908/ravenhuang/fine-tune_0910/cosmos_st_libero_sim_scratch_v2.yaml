# @package _global_
defaults:
  - ravenhuang/fine-tune/cosmos_st_eam_libero_sim_split_base.yaml

## notes:
## model size: ~140M params
## effective batch size: 384 (6 nodes)

name: libero_sim_scratch_agent_action_9

dataset:
  datasets:
    Libero:
      sample_zero_action: true
      transform:
        multiview: true
        cameras: ["agentview_rgb"]

val_dataset:
  datasets:
    Libero:
      sample_zero_action: true
      transform:
        multiview: true
        cameras: ["agentview_rgb"]

viz_dataset:
  datasets:
    Libero:
      sample_zero_action: true
      transform:
        multiview: true
        cameras: ["agentview_rgb"]

libero_unseen_val_dataset:
  datasets:
    Libero:
      sample_zero_action: true
      transform:
        multiview: true
        cameras: ["agentview_rgb"]

data_loader:
  batch_size: 12

hydra:
  launcher:
    nodes: 4
    account: cortex
    qos: h100_cortex_high

model:
  rgb_tokenizer:
    tokenizer_name: Cosmos-0.1-Tokenizer-CI8x8
    output_dim: 16
  rgb_pos_embed:
    _args_:
      - ${dataset.transform.sample_size}
      - 32 #256/8
      - 32 #64 for multi-view
  action_encoder:
    _target_: robot_wm.modeling.modules.mlp.MultiMLP
    output_dim: 32
    decoders:
      "5": # libero
        # _target_: robot_wm.modeling.modules.mlp.MLP
        _target_: robot_wm.modeling.tokenizers.action.decoder.ActionXattenEncoder
        input_dim: 80 # action_dim
        hidden_dim: 256
        output_dim: ${model.action_encoder.output_dim}
        rgb_latent_dim: 16
  inverse_model:
    arch: small
    num_actions: 1
  quantizer:
    dim: 32
    size: 2048
    use_ste: False
  forward_model:
    arch: small
    # use_video_cross_attention: false
    # use_spatial_attention_only: true
    use_video_cross_attention: true
    use_spatial_attention_only: false
    rope_end: 2048
  loss_scheduler:
    pretrain_steps: 0
    ae_only_steps: 85_001
    # action_decode_steps: 85_000
    losses: ["teacher-forcing"]
  config:
    backprog_action_decoding: False #don't modify acion latent during pre-training
    decode_zhat: True
    action_decoding_weight: 10
    action_decoding_loss_type: "l1"
    use_cycle_consistency_loss: False

wandb:
  entity: project_vit

trainer:
  config:
    # saving:
    #   save_path: '/home/ravenh/lacwm-dit/projects/latent_action_models/data/experiments_0908/libero_sim_scratch_mv_sample_zero_action/2025-11-19/14-52-39/snapshot.pt'
    max_iter: 100_000
