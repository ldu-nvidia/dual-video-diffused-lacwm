# @package _global_
defaults:
  - override /datasets@dataset: transformed_two_clock_consistency_abc
  - override /datasets@val_dataset: transformed_two_clock_consistency_abc
  - override /datasets@viz_dataset: transformed_two_clock_consistency_abc
  - override /models@model: dual_explicit_action_dit_adjacent_consistency
  - override /tokenizers/rgb@model.rgb_tokenizer: wan_vae
  - override /optimizers@optimizer_factory: adamw
  - override /lr_schedulers@lr_scheduler_factory: linear_warmup_cosine_decay

name: adjacent-consistency-common
seed: 1234

dataset:
  padding_dim: 157
  seed: ${seed}
  infinite: true
  img_augment: false
  emit_crop_rgb: false
  transform: {sample_size: 13, chunk_size: 5}
  future_validity: {enabled: false, max_retries: 0}
  datasets:
    ABC:
      clip_manifest: ${oc.env:ACD_P0_TRAIN_CLIP_MANIFEST}
      cache_metadata: ${oc.env:ACD_P0_TRAIN_CACHE_METADATA}
      expected_split: train
      expected_clip_count: 512
      expected_manifest_sha256: eeace7b0c9f5b6598f32e802d6d3678b6deccccf5b62c6cea2bb3d5478ab8b74
      expected_rgb_sha256: b5bdde4461c75bc88653c38b737021fcbd69b0b22f4c87bc8e8097c3494b64ee
      expected_actions_sha256: f2cde809c1d864d4a00422aca8fcac0116229a0b0ac83a93850d1421d16c5b89

# Endpoint clips remain structurally unreachable during training.
val_dataset: ${dataset}
viz_dataset: ${dataset}

data_loader:
  batch_size: 1
  num_workers: 4
  pin_memory: true
  prefetch_factor: 2
  persistent_workers: true
val_data_loader: []
viz_data_loader: []

model:
  rgb_tokenizer:
    output_dim: 16
    input_mean: [0.5, 0.5, 0.5]
    input_std: [0.5, 0.5, 0.5]
  forward_model:
    lora_rank: 64
    lora_alpha: 128
    lora_dropout: 0.05
    gradient_checkpointing: true
  num_history_frames: 5
  num_future_frames: 8
  viz_num_steps: 1
  action_encoder:
    action_dim: ${dataset.padding_dim}
    chunk_size: ${dataset.transform.chunk_size}
  morphology_tokens:
    _target_: robot_wm.modeling.modules.learnable_embeddings.LearnableEmbeddings
    num_embeddings: 10
    embedding_dim: 64

optimizer_factory: {lr: 5.0e-6, betas: [0.9, 0.95]}
lr_scheduler_factory:
  lr_lambda:
    warmup_steps: 40
    total_steps: ${trainer.config.max_iter}
    final_learning_rate: 1.0e-6

wandb:
  enabled: false
  mode: disabled
  entity: zijiandu
  project: dual-video-diffusion-private
  group: null
  name: ${name}
  tags: [abc, vpm, acd-p0, direct-low-nfe, seed-1234]

trainer:
  _target_: robot_wm.utils.adjacent_consistency_trainer.AdjacentConsistencyTrainer
  config:
    max_iter: 400
    transition_handoff_path: null
    gradient_accumulation_steps: 1
    throughput_warmup_steps: 40
    load_path: ${oc.env:ACD_P0_PARENT_SNAPSHOT}
    parent_resolved_config: ${oc.env:ACD_P0_PARENT_RESOLVED_CONFIG}
    exclude_keys: []
    logging: {log_every: 1}
    saving: {save_every: 200}
    validation: {val_every: 1000000, n_val_samples: 0, save_best: false}
    visualization: {viz_every: 1000000, require_success: false}
    gradient_clipping: {max_norm: 1.0, norm_type: 2.0, error_if_nonfinite: true}

hydra:
  run:
    dir: ${oc.env:ACD_P0_RUN_ROOT}/${name}
  sweep:
    dir: ${oc.env:ACD_P0_RUN_ROOT}/${name}
