# @package _global_
defaults:
  - override /datasets@dataset: transformed_causal_motion_plan_abc
  - override /datasets@val_dataset: transformed_causal_motion_plan_abc
  - override /datasets@viz_dataset: transformed_causal_motion_plan_abc
  - override /models@model: dual_explicit_action_dit_causal_motion_plan
  - override /tokenizers/rgb@model.rgb_tokenizer: wan_vae
  - override /optimizers@optimizer_factory: adamw
  - override /lr_schedulers@lr_scheduler_factory: linear_warmup_cosine_decay

name: camp-common
seed: 1234

dataset: &training_dataset
  padding_dim: 157
  seed: ${seed}
  infinite: true
  img_augment: false
  emit_crop_rgb: false
  transform: {sample_size: 13, chunk_size: 5}
  future_validity: {enabled: false, max_retries: 0}
  datasets:
    ABC:
      clip_manifest: ${oc.env:CAMP_TRAIN_CLIP_MANIFEST}
      cache_metadata: ${oc.env:CAMP_TRAIN_CACHE_METADATA}
      split_role: all
val_dataset: &validation_dataset
  <<: *training_dataset
  infinite: true
  datasets:
    ABC:
      clip_manifest: ${oc.env:CAMP_VAL_CLIP_MANIFEST}
      cache_metadata: ${oc.env:CAMP_VAL_CACHE_METADATA}
      split_role: all
viz_dataset:
  <<: *validation_dataset

data_loader:
  batch_size: 1
  num_workers: 4
  pin_memory: true
  prefetch_factor: 2
  persistent_workers: true
val_data_loader:
  - _target_: torchdata.stateful_dataloader.StatefulDataLoader
    dataset: ${val_dataset}
    batch_size: 2
    num_workers: 2
    pin_memory: true
    prefetch_factor: 2
    persistent_workers: false
viz_data_loader: []

model:
  rgb_tokenizer:
    output_dim: 16
    input_mean: [0.5, 0.5, 0.5]
    input_std: [0.5, 0.5, 0.5]
  forward_model:
    lora_rank: 64
    lora_alpha: 128
    lora_dropout: 0.05
    gradient_checkpointing: true
  num_history_frames: 5
  num_future_frames: 8
  viz_num_steps: 1
  action_encoder:
    action_dim: ${dataset.padding_dim}
    chunk_size: ${dataset.transform.chunk_size}
  morphology_tokens:
    _target_: robot_wm.modeling.modules.learnable_embeddings.LearnableEmbeddings
    num_embeddings: 10
    embedding_dim: 64

optimizer_factory: {lr: 1.0e-4, betas: [0.9, 0.95]}
lr_scheduler_factory:
  lr_lambda:
    warmup_steps: 20
    total_steps: ${trainer.config.max_iter}
    final_learning_rate: 1.0e-6

wandb:
  enabled: true
  mode: online
  entity: zijiandu
  project: dual-video-diffusion-private
  group: null
  name: ${name}
  tags: [abc, vpm, camp, plan-first, controlled-screen, seed-1234]
  settings:
    start_method: thread
    save_code: false
    finish_timeout: 120.0
    finish_timeout_raises: false

trainer:
  _target_: robot_wm.utils.causal_motion_plan_trainer.CausalMotionPlanTrainer
  config:
    max_iter: 200
    gradient_accumulation_steps: 1
    throughput_warmup_steps: 20
    load_path: ${oc.env:CAMP_VPM_SNAPSHOT}
    exclude_keys:
      - forward_model.tf_token_adapter
      - forward_model.tf_clock_embedding
      - forward_model.tf_velocity_head
    logging: {log_every: 1}
    saving: {save_every: 100}
    validation: {val_every: 100, n_val_samples: 4, save_best: false}
    visualization: {viz_every: 200, require_success: false}
    gradient_clipping: {max_norm: 1.0}

hydra:
  run:
    dir: ${oc.env:CAMP_RUN_ROOT}/${name}
  sweep:
    dir: ${oc.env:CAMP_RUN_ROOT}/${name}
