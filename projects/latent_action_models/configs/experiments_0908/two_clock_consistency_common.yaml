# @package _global_
defaults:
  - override /datasets@dataset: transformed_two_clock_consistency_abc
  - override /datasets@val_dataset: transformed_two_clock_consistency_abc
  - override /datasets@viz_dataset: transformed_two_clock_consistency_abc
  - override /models@model: dual_explicit_action_dit_two_clock_consistency
  - override /tokenizers/rgb@model.rgb_tokenizer: wan_vae
  - override /optimizers@optimizer_factory: adamw
  - override /lr_schedulers@lr_scheduler_factory: linear_warmup_cosine_decay

name: two-clock-consistency-common
seed: 1234

dataset: &training_dataset
  padding_dim: 157
  seed: ${seed}
  infinite: true
  img_augment: false
  emit_crop_rgb: false
  transform: {sample_size: 13, chunk_size: 5}
  future_validity: {enabled: false, max_retries: 0}
  datasets:
    ABC:
      clip_manifest: ${oc.env:TWO_CLOCK_CONSISTENCY_TRAIN_CLIP_MANIFEST}
      cache_metadata: ${oc.env:TWO_CLOCK_CONSISTENCY_TRAIN_CACHE_METADATA}
      expected_split: train
      expected_clip_count: 512
      expected_manifest_sha256: eeace7b0c9f5b6598f32e802d6d3678b6deccccf5b62c6cea2bb3d5478ab8b74
      expected_rgb_sha256: b5bdde4461c75bc88653c38b737021fcbd69b0b22f4c87bc8e8097c3494b64ee
      expected_actions_sha256: f2cde809c1d864d4a00422aca8fcac0116229a0b0ac83a93850d1421d16c5b89
val_dataset: &validation_dataset
  <<: *training_dataset
  # Trainer validates three times (updates 0, 100, and 199). Keep the iterator
  # cycling so the second validation cannot exhaust the finite rank shard.
  infinite: true
  datasets:
    ABC:
      clip_manifest: ${oc.env:TWO_CLOCK_CONSISTENCY_VAL_CLIP_MANIFEST}
      cache_metadata: ${oc.env:TWO_CLOCK_CONSISTENCY_VAL_CACHE_METADATA}
      expected_split: val
      expected_clip_count: 64
      expected_manifest_sha256: 8cb39c1f056855e28855c0b944c715d084b709e1421f4efeed3710e7099348c4
      expected_rgb_sha256: ed82fc0f580baa90c4dc39c1608f97ad7092a4ddcb59c3612eed31711afda404
      expected_actions_sha256: 552a5cf0af156868d2866dfacabe102fc6b5cd24580bb377953e35a14625306a
viz_dataset:
  <<: *validation_dataset

data_loader:
  batch_size: 1
  num_workers: 4
  pin_memory: true
  prefetch_factor: 2
  persistent_workers: true
val_data_loader:
  - _target_: torchdata.stateful_dataloader.StatefulDataLoader
    dataset: ${val_dataset}
    batch_size: 2
    num_workers: 2
    pin_memory: true
    prefetch_factor: 2
    persistent_workers: false
# The dedicated evaluator owns qualitative/metric generation.  No protected
# or alternate split is configured as a trainer visualization loader.
viz_data_loader: []

model:
  rgb_tokenizer:
    output_dim: 16
    input_mean: [0.5, 0.5, 0.5]
    input_std: [0.5, 0.5, 0.5]
  forward_model:
    lora_rank: 64
    lora_alpha: 128
    lora_dropout: 0.05
    gradient_checkpointing: true
  num_history_frames: 5
  num_future_frames: 8
  viz_num_steps: 1
  action_encoder:
    action_dim: ${dataset.padding_dim}
    chunk_size: ${dataset.transform.chunk_size}
  morphology_tokens:
    _target_: robot_wm.modeling.modules.learnable_embeddings.LearnableEmbeddings
    num_embeddings: 10
    embedding_dim: 64
  dual_diffusion:
    enabled: true
    auxiliary_history_mode: diffuse_all
    tf_channels: 64
    condition_on_tf: false
    condition_on_tf_clock: false
    # Preserve the historical VPM's unused auxiliary-head computation. This
    # clock never enters the video trunk and its zero-weight output is ignored.
    head_condition_on_tf_clock: true
    condition_mode: "off"
    schedule_mode: aligned
    tf_lead_logit: 0.0
    tf_loss_weight: 0.0
    video_only_control: false
    parameter_matched_control: true
    state_gate_init: 0.0
    state_gate_trainable: true
    clock_gate_init: 0.0
    clock_gate_trainable: true
    capture_latent_trajectories: false
    artifact_batch_limit: null
    evaluation_nfe_steps: [1, 2, 4]
    evaluation_noise_seed: 20260726
    evaluation_condition_sources: [autonomous]

# Both arms start from the exact same model snapshot but intentionally use a
# fresh, identical fine-tuning optimizer/schedule.  The historical Trainer has
# no EMA, so both arms evaluate non-EMA checkpoints under the same policy.
optimizer_factory: {lr: 1.0e-4, betas: [0.9, 0.95]}
lr_scheduler_factory:
  lr_lambda:
    warmup_steps: 20
    total_steps: ${trainer.config.max_iter}
    final_learning_rate: 1.0e-6

wandb:
  enabled: true
  mode: online
  entity: zijiandu
  project: dual-video-diffusion-private
  group: null
  name: ${name}
  tags: [abc, vpm, two-clock-consistency, controlled-screen, seed-1234]
  settings:
    start_method: thread
    save_code: false
    finish_timeout: 120.0
    finish_timeout_raises: false

trainer:
  _target_: robot_wm.utils.two_clock_consistency_trainer.TwoClockConsistencyTrainer
  config:
    max_iter: 200
    transition_handoff_path: null
    gradient_accumulation_steps: 1
    throughput_warmup_steps: 20
    load_path: ${oc.env:TWO_CLOCK_CONSISTENCY_VPM_SNAPSHOT}
    exclude_keys: []
    logging: {log_every: 1}
    saving: {save_every: 100}
    # Four local batches x two clips x eight ranks = all 64 validation clips.
    validation: {val_every: 100, n_val_samples: 4, save_best: false}
    visualization: {viz_every: 200, require_success: false}
    gradient_clipping: {max_norm: 1.0}

hydra:
  run:
    dir: ${oc.env:TWO_CLOCK_CONSISTENCY_RUN_ROOT}/${name}
  sweep:
    dir: ${oc.env:TWO_CLOCK_CONSISTENCY_RUN_ROOT}/${name}
