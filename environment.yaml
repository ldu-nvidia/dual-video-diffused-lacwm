# Conda convenience environment. The canonical B200 path is
# tools/env/create_b200_env.sh, which also pins and validates VideoX-Fun.
# Create this alternative from the repo root:
#   conda env create -f environment.yaml
#   conda activate lacwm-dit
# (installs the same pinned B200 requirements + this package).
name: lacwm-dit
channels:
  - conda-forge
dependencies:
  - python=3.10.20
  - pip
  - pip:
      - -r requirements-b200-lock.txt
      - -e .
